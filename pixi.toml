[workspace]
authors = ["Mark Kittisopikul <kittisopikulm@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "SmartSPIM"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
extract_index = { cmd = "python3 extract_index.py {{ims_file}}", args = ["ims_file"] }

[dependencies]
hdf5 = ">=2.1.0,<3"
h5py = ">=3.10,<4"
python = ">=3.11,<4"
numpy = ">=1.26,<3"
zarr = ">=3,<4"
